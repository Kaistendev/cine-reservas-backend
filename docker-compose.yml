services:
  postgres:
    image: postgres:16-alpine
    container_name: cine-postgres
    environment:
      POSTGRES_USER: cineuser
      POSTGRES_PASSWORD: cinepass
      POSTGRES_DB: cinereservas
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cineuser -d cinereservas"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: cine-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://cineuser:cinepass@postgres:5432/cinereservas
      JWT_SECRET: changeitchangeitchangeit
      JWT_REFRESH_SECRET: changeitchangeitchangeit2
      PORT: "3000"
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: cine-frontend
    ports:
      - "5173:80"
    depends_on:
      - app

volumes:
  pgdata:
