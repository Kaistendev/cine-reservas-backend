services:
  postgres:
    image: postgres:16-alpine
    container_name: cine-postgres
    environment:
      POSTGRES_USER: cineuser
      POSTGRES_PASSWORD: cinepass
      POSTGRES_DB: cinereservas
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
